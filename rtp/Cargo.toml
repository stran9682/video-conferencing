[package]
name = "rtp"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1.11.0"
dashmap = "6.1.0"
rand = "0.10.0"
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
iroh = "0.98.0"
anyhow = "1.0.102"
iroh-blobs = "0.100.0"
uuid = "1.23.1"
iroh-docs = "0.98.0"
iroh-gossip = "0.98.0"
tokio-stream = "0.1.18"
